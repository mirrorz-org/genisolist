[msys2]
distro = MSYS2
listvers = 1
location = github-release/msys2/msys2-installer/msys2-*.exe
pattern = /msys2-([a-zA-Z0-9_-]+)-([0-9]+)\.exe$
platform = Windows
type = $1
version = $2
category = app

[msys2-sfx]
distro = MSYS2
listvers = 1
location = github-release/msys2/msys2-installer/msys2-*.sfx.exe
pattern = /msys2-([a-zA-Z0-9_-]+)-([0-9]+)\.sfx\.exe$
platform = Windows
type = self-extracting
version = $2
category = app
