[escrcpy-linux-deb]
distro = Escrcpy
location = github-release/viarotel-org/escrcpy/*.deb
pattern = Escrcpy-([\d\.]+)-linux-([^\.]+)\.deb
platform = $2
type = deb
version = $1
category = app

[escrcpy-linux-appimage]
distro = Escrcpy
location = github-release/viarotel-org/escrcpy/*.AppImage
pattern = Escrcpy-([\d\.]+)-linux-([^\.]+)\.AppImage
platform = $2
type = AppImage
version = $1
category = app

[escrcpy-mac-dmg]
distro = Escrcpy
location = github-release/viarotel-org/escrcpy/*.dmg
pattern = Escrcpy-([\d\.]+)-mac-([^\.]+)\.dmg
platform = $2
type = dmg
version = $1
category = app

[escrcpy-win-exe]
distro = Escrcpy
location = github-release/viarotel-org/escrcpy/*.exe
pattern = Escrcpy-([\d\.]+)-win-([^\.]+)\.exe
platform = $2
type = exe
version = $1
category = app
