[vlc-win]
distro = VLC
listvers = 1
location = videolan-ftp/vlc/last/*/*
pattern = videolan-ftp/vlc/last/(win32|win64)/vlc-([\d\.]+)-win(32|64)\.(exe|msi|7z)(?!.)
platform = $1
type = $4
version = $2
category = app

[vlc-macosx]
distro = VLC
listvers = 1
location = videolan-ftp/vlc/last/macosx/vlc-*.dmg
pattern = videolan-ftp/vlc/last/macosx/vlc-([\d\.]+)-(.+)\.dmg
version = $1
platform = macosx/$2
type = dmg
category = app


[vlc-android]
distro = VLC
listvers = 1
location = videolan-ftp/vlc-android/last/*.apk
pattern = videolan-ftp/vlc-android/last/VLC-Android-([\d\.]+)-(.+)\.apk
version = $1
platform = Android/$2
type = apk
category = app
