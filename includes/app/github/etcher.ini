[etcher-dmg]
distro = balenaEtcher
category = app
listvers = 1
location = github-release/balena-io/etcher/v*/*.dmg
pattern = github-release/balena-io/etcher/v([\d\.]+)/balenaEtcher-[\d\.]+-([a-zA-Z0-9]+)\.dmg
version = $1
platform = macosx/$2
type = dmg

[etcher-exe]
distro = balenaEtcher
category = app
listvers = 1
location = github-release/balena-io/etcher/v*/*.exe
pattern = github-release/balena-io/etcher/v([\d\.]+)/balenaEtcher-[\d\.]+\.Setup\.exe
version = $1
platform = windows
type = exe
