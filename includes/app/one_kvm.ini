[One-KVM-deb]
distro = One-KVM
listvers = 1
location = github-release/mofeng-git/One-KVM/One-KVM Rust */*
pattern = /One-KVM Rust [\d\.]+（\d+）/(one-kvm_([\d\.]+)_([^\.]+)\.deb)
platform = $3
type = deb
version = $2
category = app

[One-KVM-fpk]
distro = One-KVM
listvers = 1
location = github-release/mofeng-git/One-KVM/One-KVM Rust */*.fpk
pattern = /One-KVM Rust ([\d\.]+)（(\d+)）/(one-kvm-([\d\.]+)-all\.fpk)
platform = All
type = fpk
version = $1
category = app
