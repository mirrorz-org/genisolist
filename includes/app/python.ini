[python-windows]
distro = Python
listvers = 50
location = python/3.*/python-3.*-*.exe
pattern = python-(3\.\d+\.\d+)-(amd64|arm64).exe
platform = $2
type = exe
version = $1
category = app

[python-windows-win32]
distro = Python
listvers = 50
location = python/3.*/python-3.*.exe
pattern = python-(3\.\d+\.\d+).exe
platform = win32
type = exe
version = $1
category = app

[python-macos]
distro = Python
listvers = 50
location = python/3.*/*.pkg
pattern = python-(3\.\d+\.\d+)-macos(.*)\.pkg
platform = Universal
type = pkg
version = $1
category = app