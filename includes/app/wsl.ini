[WSL]
distro = WSL
listvers = 1
location = github-release/microsoft/WSL/wsl.*
pattern = /wsl\.([\d\.]+)\.([^\.]+)\.([\w\.]+)
platform = $2
type = $3
version = $1
category = app
[WSL-msixbundle]
distro = WSL
listvers = 1
location = github-release/microsoft/WSL/*.msixbundle
pattern = /Microsoft\.WSL_([\d\.]+)_([^\.]+)\.([\w\.]+)
platform = Universal
type = $3
version = $1
category = app
