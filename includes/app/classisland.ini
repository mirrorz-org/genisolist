[ClassIsland-ZIP]
distro = ClassIsland
listvers = 1
location = github-release/ClassIsland/ClassIsland/*/*.zip
pattern = /ClassIsland/([0-9.]+)/ClassIsland_app_([^_]+)_([^_]+)_([^_]+)_folder\.zip
platform = $2-$3
type = $4-zip
version = $1
category = app

[ClassIsland-Package]
distro = ClassIsland
listvers = 1
location = github-release/ClassIsland/ClassIsland/*/*
pattern = /ClassIsland/([0-9.]+)/ClassIsland_app_([^_]+)_([^_]+)_([^_]+)_([^_]+)\.(deb|pkg)
platform = $2-$3
type = $4-$6
version = $1
category = app
