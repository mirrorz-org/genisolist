[archlinux]
distro = Arch Linux
listvers = 3
location = archlinux/iso/[0-9]*/archlinux-*.iso
pattern = archlinux-(\d+\.\d+\.\d+)-(\w+).iso
version = $1
type = CLI-only
platform = $2

[archlinux_wsl]
distro = Arch Linux
listvers = 3
location = archlinux/wsl/[0-9]*/archlinux-*.wsl
pattern = /archlinux-([\d\.]+)\.wsl
version = $1
type = WSL
platform = wsl
