[wsl-ubuntu]
distro = WSL Linux 发行版
listvers = 4
location = ubuntu-releases/[a-z]*/ubuntu-*-wsl-*.wsl
pattern = ubuntu-([0-9.]+)-wsl-(\w+).wsl
version = $1
type = Ubuntu
platform = $2

[wsl_archlinux]
distro = WSL Linux 发行版
listvers = 4
location = archlinux/wsl/[0-9]*/archlinux-*.wsl
pattern = /archlinux-([\d\.]+)\.wsl
version = $1
type = Arch Linux
platform = Universal

[wsl_fedora]
distro = WSL Linux 发行版
listvers = 4
location_0 = fedora/releases/[1-9][0-9]/Container/*/images/Fedora-WSL-*.wsl
pattern = Fedora-WSL-(\w+)-(\d+)-[\d\.]+\.(\w+)\.wsl
version = $2
type = Fedora
platform = $3

[archlinux_wsl]
distro = Arch Linux
listvers = 3
location = archlinux/wsl/[0-9]*/archlinux-*.wsl
pattern = /archlinux-([\d\.]+)\.wsl
version = $1
type = WSL
platform = wsl

[fedora_wsl]
distro = Fedora
listvers = 2
location_0 = fedora/releases/[1-9][0-9]/Container/*/images/Fedora-WSL-*.wsl
pattern = Fedora-WSL-(\w+)-(\d+)-[\d\.]+\.(\w+)\.wsl
version = $2
type = WSL
platform = $3

[ubuntu_wsl]
distro = Ubuntu
listvers = 4
location = ubuntu-releases/[a-z]*/ubuntu-*-wsl-*.wsl
pattern = ubuntu-([0-9.]+)-wsl-(\w+).wsl
version = $1
type = WSL
platform = $2